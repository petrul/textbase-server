### generic for all profiles
app.name=Textbase - server
app.description=Textbase is a structured digital library
server.port=8080

spring.kafka.bootstrap-servers=${KAFKA_BROKERS}
milvus.host=${MILVUS_HOST}
milvus.port=${MILVUS_PORT}
repo.tei.dirs=${REPO_TEI_DIRS:/scriptorium-masters}
cache.dir=${CACHE_DIR:/cache}
# Local Lucene full-text index directory - not an external service, so a
# derived default (unlike milvus.host/embedder.host etc, which fail fast
# with no default - see cache.dir above for the same reasoning) is fine.
lucene.index.dir=${LUCENE_INDEX_DIR:${cache.dir}/lucene-index}
embedder.host=${EMBEDDER_HOST}
embedder.port=${EMBEDDER_PORT}

# Ollama server backing the BGE-M3 default and optional Qwen/Nomic embedders.
ollama.host=zmeu.local
ollama.port=11434

# Sentence-transformers server backing the STS-based embedders (see
# VectorConfig). Same "one fixed instance across every profile" reasoning as
# ollama.host/port above - decoupled from it since they're different
# services at different addresses, not interchangeable.
sts.host=mini.local
sts.port=11200

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}/${MYSQL_DB}?autoReconnect=true&useSSL=false&noAccessToProcedureBodies=true&serverTimezone=Europe/Bucharest&useTimezone=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}


spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto = update

logging.level=INFO
logging.level.org.springframework=INFO
logging.level.com=INFO

server.error.include-stacktrace=never
server.error.include-message=always

springdoc.swagger-ui.path=/api/docs.html
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.configUrl=/api/api-docs/swagger-config

### these are profile-specific

textbase.advertised.url=${TEXTBASE_EXTERNAL_URL:https://textbase.scriptorium.ro}
spring.data.rest.basePath=/api/drest/

# Google One Tap / Sign in with Google (see GoogleTokenInfoVerifier,
# GoogleAuthController, fragments/google-one-tap.html). Deliberately
# defaults to blank rather than a guessed value - GoogleTokenInfoVerifier
# treats a blank client id as "feature not configured yet" and refuses
# every credential rather than silently accepting tokens meant for some
# other Google app. Get a real one from https://console.cloud.google.com/
# (OAuth 2.0 Client ID, Web application, with this app's origin listed
# under Authorized JavaScript origins) and set GOOGLE_OAUTH_CLIENT_ID.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
